<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d2b3a" />
    <meta
      name="description"
      content="Bolt Sort: a calm, brain-teasing color sort puzzle. Move the nuts until every bolt holds one color."
    />
    <title>Bolt Sort</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2b3a;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #game canvas {
        display: block;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f3d28a;
        font:
          700 28px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="splash">Bolt Sort</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
